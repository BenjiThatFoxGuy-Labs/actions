name: Sync Test

on:
  # schedule:
    # - cron: "0 0 * * 0"  # Runs every Sunday at midnight; adjust as needed
    # - cron: "0 23 * * 3" 
    # - cron: "0 8 * * 4"
    # - cron: "0 0 1 * *"  # Runs on the first day of every month at midnight; adjust as needed
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-test.yml
  workflow_dispatch:

# Allow one concurrent deployment
concurrency:
  group: sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Prepare Rclone config
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path

          encoded = "".join(os.environ["RCLONE_CONFIG_B64"].split())
          config = base64.b64decode(encoded, validate=True)
          if config.startswith(b"\x1f\x8b"):
              config = gzip.decompress(config)

          config_path = Path.home() / ".config" / "rclone" / "rclone.conf"
          config_path.parent.mkdir(parents=True, exist_ok=True)
          config_path.write_bytes(config)
      - name: Setup Rclone
        uses: BenjiThatFoxGuy/setup-bclone@v1
      - name: Restore Rclone index cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rclone/**/*.json
            ~/.cache/rclone/**/*.db
            ~/.cache/rclone/**/*.bolt
          key: rclone-index-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rclone-index-${{ runner.os }}-
      - name: rclone
        continue-on-error: true
        run: |
          rclone sync ${{ secrets.source0 }} ${{ secrets.target0 }} --max-duration=30m --cutoff-mode=soft --retries 10 --low-level-retries 3 --check-first --checkers 8 --transfers 4 --metadata --cutoff-mode soft --tpslimit=10 --timeout=1h
      - name: Dispatch Cleanup
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_TOKEN_2 }}
          repository: ${{ github.repository_owner }}/${{ github.event.repository.name }}
          event-type: deploy

  trigger-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Dispatch Cleanup
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_TOKEN_2 }}
          repository: ${{ github.repository_owner }}/${{ github.event.repository.name }}
          event-type: deploy
