name: Backup Test

on:
  # schedule:
    # - cron: "0 0 * * 0"  # Runs every Sunday at midnight; adjust as needed
    # - cron: "0 0 1 * *"  # Runs on the first day of every month at midnight; adjust as needed
  push:
    branches:
      - main
    paths:
      - .github/workflows/backup-test.yml
  workflow_dispatch:

# Allow one concurrent deployment
concurrency:
  group: backup
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Setup Rclone
        uses: BenjiThatFoxGuy/setup-bclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG_B64 }}
      - name: Restore Rclone index cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rclone/**/*.json
            ~/.cache/rclone/**/*.db
            ~/.cache/rclone/**/*.bolt
          key: rclone-index-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rclone-index-${{ runner.os }}-
      - name: rclone
        continue-on-error: true
        run: |
          rclone copy ${{ secrets.source }} ${{ secrets.target }} --max-transfer=4G --cutoff-mode=soft --retries 10 --low-level-retries 3 --check-first --checkers 8 --transfers 4 --metadata --cutoff-mode soft --tpslimit=10 --timeout=1h
      - name: Dispatch Cleanup
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_TOKEN_2 }}
          repository: ${{ github.repository_owner }}/${{ github.event.repository.name }}
          event-type: deploy

  sync2:
    runs-on: ubuntu-latest
    needs: sync
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Setup Rclone
        uses: BenjiThatFoxGuy/setup-bclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG_B64 }}
      - name: Restore Rclone index cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rclone/**/*.json
            ~/.cache/rclone/**/*.db
            ~/.cache/rclone/**/*.bolt
          key: rclone-index-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rclone-index-${{ runner.os }}-
      - name: rclone
        continue-on-error: true
        run: |
          rclone copy ${{ secrets.source }} ${{ secrets.target2 }} --max-transfer=4G --retries 10 --low-level-retries 3 --check-first --checkers 100 --transfers 4 --metadata --cutoff-mode soft --tpslimit=10 --timeout=1h
      - name: Dispatch Cleanup
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_TOKEN_2 }}
          repository: ${{ github.repository_owner }}/${{ github.event.repository.name }}
          event-type: deploy

  trigger-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Dispatch Cleanup
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_TOKEN_2 }}
          repository: ${{ github.repository_owner }}/${{ github.event.repository.name }}
          event-type: deploy
